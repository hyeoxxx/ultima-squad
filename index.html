<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>울티마 스쿼드</title>
  <meta name="description" content="용병을 성장시키고 자동 전투로 스테이지를 공략하는 방치형 미니게임 (팬메이드)">
  <link rel="icon" href="assets/items/war_8_weapon.png">
  <link rel="stylesheet" href="style.css?v=31">
</head>
<body>
  <header class="top">
    <div class="brand"><img class="logo" src="assets/items/war_8_weapon.png" alt=""><h1>울티마 스쿼드</h1></div>
    <div class="wallet">
      <span title="메소"><img class="mi" src="assets/icons/meso.png" alt=""> <b id="wGold">0</b></span>
      <span title="훈련용 큐브"><img class="mi" src="assets/icons/cube.png" alt=""> <b id="wCube">0</b></span>
      <span title="스쿼드 코인"><img class="mi" src="assets/icons/squad_coin.png" alt=""> <b id="wSquad">0</b></span>
      <span title="카오스 스쿼드 코인"><img class="mi" src="assets/icons/chaos_coin.png" alt=""> <b id="wChaos">0</b></span>
    </div>
  </header>

  <main class="wrap">
    <section class="battle">
      <div class="battle-top">
        <div class="stage-name"><span id="stageMode" class="mode-tag">일반</span> <b id="stageLabel">1-1</b> <span id="stageMap">헤네시스 북쪽 언덕</span></div>
        <div id="ticker" class="ticker"></div>
      </div>
      <div class="canvas-wrap">
        <canvas id="cv" width="1000" height="400"></canvas>
        <button id="btnBox" class="ov-btn box" title="에스페시아 상자 소환 (하루 1회)"><img class="bi" src="assets/icons/box.png" alt=""></button>
        <button id="btnPortal" class="ov-btn portal" title="다음 스테이지로 이동" hidden><img class="pi" src="assets/icons/portal.png" alt=""><small>다음</small></button>
        <div id="banner" class="banner"></div>
        <div class="party" id="party"></div>
        <div class="pip-info" id="pipInfo"></div>
      </div>
      <div class="battle-bottom">
        <div class="gauge"><div id="gaugeFill"></div><span id="gaugeText">0 / 61</span></div>
        <button id="btnRepeat" class="chip" title="같은 스테이지 반복">반복</button>
        <button id="btnBag" class="chip bag" title="용병 관리"><img class="mi" src="assets/icons/bag.png" alt=""> <span id="bagInfo">0/10</span><i id="bagNew" hidden></i></button>
        <button id="btnPip" class="chip" title="전투 화면을 항상 위에 떠 있는 작은 창으로 (크롬/엣지)">PIP</button>
        <button id="btnBgm" class="chip" title="배경음악 켜기/끄기">BGM</button>
        <label class="vol" title="전체 볼륨"><span class="small muted">음량</span><input type="range" id="vol" min="0" max="100" step="5"></label>
      </div>
    </section>

    <section class="manage" id="manage">
      <nav class="tabs" id="tabs">
        <button data-tab="merc" class="on">용병 설정</button>
        <button data-tab="inv">인벤토리</button>
        <button data-tab="pot">잠재능력</button>
        <button data-tab="synth">장비 합성</button>
        <button data-tab="dis">장비 분해</button>
        <button data-tab="map">맵</button>
        <button data-tab="util">유틸리티</button>
        <button data-tab="auto">자동</button>
        <button data-tab="shop">코인 강화</button>
        <button data-tab="settings">설정</button>
        <button data-tab="etc">기타</button>
      </nav>
      <div id="panel" class="panel"></div>
    </section>
  </main>

  <footer class="foot">
    메이플스토리 「울티마 스쿼드」 이벤트를 재현한 팬메이드 게임입니다 · 진행 기록은 이 브라우저에 저장돼요 ·
    <a href="https://github.com/hyeoxxx/ultima-squad" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast"></div>

  <script src="js/data.js?v=24"></script>
  <script src="js/monsters.js?v=24"></script>
  <script src="js/engine.js?v=31"></script>
  <script src="js/assets.js?v=24"></script>
  <script src="js/auto.js?v=24"></script>
  <script src="js/render.js?v=31"></script>
  <script src="js/ui.js?v=24"></script>
  <script src="js/tutorial.js?v=25"></script>
  <script src="js/main.js?v=31"></script>
</body>
</html>
