<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>울티마 스쿼드</title>
  <meta name="description" content="용병을 성장시키고 자동 전투로 스테이지를 공략하는 방치형 미니게임 (팬메이드)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">⚔️</span><h1>울티마 스쿼드</h1></div>
    <div class="wallet">
      <span title="골드">💰 <b id="wGold">0</b></span>
      <span title="훈련용 큐브">🧊 <b id="wCube">0</b></span>
      <span title="스쿼드 코인">🟡 <b id="wSquad">0</b></span>
      <span title="카오스 스쿼드 코인">🟣 <b id="wChaos">0</b></span>
    </div>
  </header>

  <main class="wrap">
    <section class="battle">
      <div class="battle-top">
        <div class="stage-name"><span id="stageMode" class="mode-tag">일반</span> <b id="stageLabel">1-1</b> <span id="stageMap">헤네시스 북쪽 언덕</span></div>
        <div id="ticker" class="ticker"></div>
      </div>
      <div class="canvas-wrap">
        <canvas id="cv" width="1000" height="400"></canvas>
        <button id="btnBox" class="ov-btn box" title="에스페시아 상자 소환 (하루 1회)">🎁</button>
        <button id="btnPortal" class="ov-btn portal" title="다음 스테이지로 이동" hidden>🌀<small>다음</small></button>
        <div id="banner" class="banner"></div>
      </div>
      <div class="battle-bottom">
        <div class="gauge"><div id="gaugeFill"></div><span id="gaugeText">0 / 61</span></div>
        <button id="btnRepeat" class="chip" title="같은 스테이지 반복">🔁 반복</button>
        <button id="btnBag" class="chip bag" title="용병 관리">🎒 <span id="bagInfo">0/10</span><i id="bagNew" hidden></i></button>
        <button id="btnPip" class="chip" title="전투 화면을 항상 위에 떠 있는 작은 창으로 (크롬/엣지)">📺 PIP</button>
        <label class="vol" title="전투 볼륨">🔊<input type="range" id="vol" min="0" max="100" step="5"></label>
      </div>
    </section>

    <section class="manage" id="manage">
      <nav class="tabs" id="tabs">
        <button data-tab="merc" class="on">용병 설정</button>
        <button data-tab="inv">인벤토리</button>
        <button data-tab="pot">잠재능력</button>
        <button data-tab="synth">장비 합성</button>
        <button data-tab="dis">장비 분해</button>
        <button data-tab="map">맵</button>
        <button data-tab="util">유틸리티</button>
        <button data-tab="shop">코인샵</button>
        <button data-tab="etc">기타</button>
      </nav>
      <div id="panel" class="panel"></div>
    </section>
  </main>

  <footer class="foot">
    메이플스토리 「울티마 스쿼드」 이벤트를 재현한 팬메이드 게임입니다 · 진행 기록은 이 브라우저에 저장돼요 ·
    <a href="https://github.com/hyeoxxx/ultima-squad" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast"></div>

  <script src="js/data.js?v=4"></script>
  <script src="js/monsters.js?v=4"></script>
  <script src="js/engine.js?v=4"></script>
  <script src="js/assets.js?v=4"></script>
  <script src="js/render.js?v=4"></script>
  <script src="js/ui.js?v=4"></script>
  <script src="js/main.js?v=4"></script>
</body>
</html>
